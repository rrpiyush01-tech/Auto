name: Build APK

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: List repository
        run: |
          echo "=== REPOSITORY ==="
          find . -maxdepth 4 -type f | sort

      - name: Extract ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)
          echo "ZIP: $ZIP"
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi
          unzip -q "$ZIP" -d project

      - name: Inspect extracted project
        run: |
          echo "=== EXTRACTED FILES ==="
          find project -type f | sort | head -200

          echo "=== GRADLE FILES ==="
          find project -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print
