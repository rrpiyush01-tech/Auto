name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Build APK
        run: |
          chmod +x $(find project -name gradlew | head -1)
          cd $(dirname $(find project -name gradlew | head -1))
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: project/**/build/outputs/apk/**/*.apk
