name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)
          unzip -q "$ZIP" -d project

      - name: Build APK
        working-directory: project/XDMHelper_Mevada
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XDMHelper-APK
          path: project/XDMHelper_Mevada/app/build/outputs/apk/debug/*.apk
